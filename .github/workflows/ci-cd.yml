name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test --exclude-tag=e2e

  build:
    name: Build validation
    runs-on: ubuntu-latest
    needs: tests
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      RENDER: 'true'
      GYMTRACK_STATIC_ROOT: ${{ github.workspace }}/test-artifacts/staticfiles
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate Django configuration
        run: python manage.py check

      - name: Build static assets
        run: python manage.py collectstatic --no-input

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: tests
    env:
      DJANGO_SECRET_KEY: ci-secret-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run E2E tests
        run: python manage.py test --tag=e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-artifacts/
          if-no-files-found: ignore

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs:
      - build
      - e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
