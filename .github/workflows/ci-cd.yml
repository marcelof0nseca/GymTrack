name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test --exclude-tag=e2e

  build:
    name: Build validation
    runs-on: ubuntu-latest
    needs: tests
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      RENDER: 'true'
      GYMTRACK_STATIC_ROOT: ${{ github.workspace }}/test-artifacts/staticfiles
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate Django configuration
        run: python manage.py check

      - name: Build static assets
        run: python manage.py collectstatic --no-input

  e2e:
    name: Cypress end-to-end tests
    runs-on: ubuntu-latest
    needs: tests
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      GYMTRACK_DB_PATH: ${{ github.workspace }}/test-artifacts/e2e.sqlite3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Prepare test data
        run: python manage.py migrate && python manage.py popular_exercicios

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run start:test-server
          command: npm run cy:run:specs
          wait-on: 'http://127.0.0.1:8000'
          wait-on-timeout: 120
          browser: chrome

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
          if-no-files-found: ignore

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs:
      - build
      - e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
