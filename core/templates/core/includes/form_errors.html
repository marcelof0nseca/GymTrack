{% if form.errors %}
    <div class="alert alert-error">
        {% for field in form %}
            {% for error in field.errors %}
                <p>
                    {% if field.label %}<strong>{{ field.label }}:</strong> {% endif %}{{ error }}
                </p>
            {% endfor %}
        {% endfor %}

        {% for error in form.non_field_errors %}
            <p>{{ error }}</p>
        {% endfor %}
    </div>
{% endif %}
