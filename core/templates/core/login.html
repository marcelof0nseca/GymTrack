{% extends 'core/base.html' %}

{% block content %}
<div class="auth-wrapper">
    <section class="auth-card">
        <h2 class="auth-title">Entrar</h2>
        <p class="auth-subtitle">Acesse sua conta para gerenciar treinos, exercícios e execuções.</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Nome de usuário</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Senha</label>
                {{ form.password }}
            </div>

            {% if form.errors %}
                <div class="alert alert-error">
                    Nome de usuário ou senha inválidos.
                </div>
            {% endif %}

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
        </form>

        <p class="auth-footer">Não tem conta? <a href="{% url 'register' %}">Cadastre-se</a></p>
    </section>
</div>
{% endblock %}
